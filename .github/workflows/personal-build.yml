name: bphamio Unsigned Build

# Manually-triggered, unsigned build of bphamio (draw.io desktop fork + the
# local MCP agent layer, freehand plugin, always-on autosave).
# See doc/BUILDING_FOR_PERSONAL_USE.md.
#
# Needs no repository secrets: signing and notarization are skipped
# (DRAWIO_UNSIGNED), auto-update is disabled so the app keeps the fork's
# changes, and nothing is published as a GitHub Release — the installer is
# only attached to this workflow run as a downloadable artifact (expires
# after GitHub's default retention window, ~90 days).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        required: true
        default: macos
        options:
          - macos
          - linux
          - windows

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.platform == 'macos' && 'macos-latest' || inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      DRAWIO_UNSIGNED: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - name: Installing Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installing Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Rebuilds js/app.min.js from the editor sources (drawio/etc/build), so
      # the shipped editor carries this fork's source changes (branding, help
      # links) instead of upstream's pre-built bundle
      - name: Build editor from source
        env:
          ANT_VERSION: 1.10.15
          ANT_SHA512: 1de7facbc9874fa4e5a2f045d5c659f64e0b89318c1dbc8acc6aae4595c4ffaf90a7b1ffb57f958dd08d6e086d3fff07aa90e50c77342a0aa5c9b4c36bff03a9
        run: |
          curl -fsSLo ant.zip "https://archive.apache.org/dist/ant/binaries/apache-ant-${ANT_VERSION}-bin.zip"
          echo "${ANT_SHA512}  ant.zip" | shasum -a 512 -c -
          unzip -q ant.zip -d "$RUNNER_TEMP"
          cd drawio/etc/build
          "$RUNNER_TEMP/apache-ant-${ANT_VERSION}/bin/ant" app
      - name: Install Linux packaging tools
        if: ${{ inputs.platform == 'linux' }}
        run: |
          sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils rpm
      - name: Build
        run: |
          npm ci
          # Bundles mcp/ (the local MCP server) into src/main/mcp-server.bundle.js,
          # which the app starts in-process; without it the agent layer is absent
          npm run build-mcp
          # disableUpdate stops the app replacing itself with the official
          # (unmodified) release via auto-update
          npm run sync -- disableUpdate
          if [ "${{ inputs.platform }}" = "windows" ]; then
            npx electron-builder --config electron-builder-win.json --publish never
          else
            # Builds the current platform's targets from the shared config:
            # dmg/zip on macOS, AppImage/deb/rpm on Linux
            npx electron-builder --config electron-builder-linux-mac.json --publish never
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bphamio-${{ inputs.platform }}-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
